name = "basepress-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.basepress.app", custom_domain = true }
]

# Article body + cover image storage. Single bucket, chain-agnostic.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "basepress-storage"

# SIWE session tokens (5-minute TTL).
[[kv_namespaces]]
binding = "SESSIONS"
id = "db793c4227af420b823fcd0fe5c52803"

# Article + permit registry. Each article: key=articleId, value={metadata, permit, signature}.
[[kv_namespaces]]
binding = "ARTICLES"
id = "61be3e92b8284ee285be38fd4337df05"

# Admin draft auto-save (50-draft quota per author, 5s client debounce).
[[kv_namespaces]]
binding = "DRAFTS"
id = "9c7edbfef19242c6836c4edb5b9f3ffa"

[vars]
ALLOWED_ORIGIN = "https://basepress.app"
# Comma-separated lowercase 0x-addresses authorized to publish.
ADMIN_ADDRESSES = "0x9e84d77264d94c646df91a70dbae99c20330ead0"
# P001-PAI-0052: super-admins can add/remove regular admins. Second slot for hardware wallet.
SUPER_ADMINS = "0x9e84d77264d94c646df91a70dbae99c20330ead0"
# PAI-0017: EIP-712 signed permits at /articles publish must recover to this address.
# Rotate together with the on-chain platformSigner whenever it changes.
PLATFORM_SIGNER = "0x9e84d77264d94c646df91a70dbae99c20330ead0"
