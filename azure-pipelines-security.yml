# PAI-0028: CI security gates — Azure DevOps mirror of .github/workflows/security.yml.
# Keep both in sync.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: security
  jobs:

  - job: pnpm_audit
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        npm install -g pnpm@10.33.0
        pnpm install --frozen-lockfile
        pnpm audit --audit-level=high --prod
      displayName: 'pnpm audit (fail high/critical)'

  - job: slither
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: |
        npm install -g pnpm@10.33.0
        pnpm install --frozen-lockfile
        cd contracts && pnpm exec hardhat compile && cd ..
        pip install slither-analyzer
        slither contracts/ --fail-high --filter-paths node_modules --ignore-compile
      displayName: 'slither static analysis'

  - job: gitleaks
    steps:
    - checkout: self
      fetchDepth: 0
    - script: |
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
          | tar -xz -C /tmp gitleaks
        /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
      displayName: 'gitleaks secret scan'

  - job: contract_coverage
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        npm install -g pnpm@10.33.0
        pnpm install --frozen-lockfile
        cd contracts
        pnpm exec hardhat coverage
      displayName: 'hardhat coverage'
    - script: |
        cd contracts
        node -e "
        const data = require('./coverage/coverage-final.json');
        const agg = { statements: {h:0,t:0}, branches: {h:0,t:0}, functions: {h:0,t:0}, lines: {h:0,t:0} };
        for (const file of Object.values(data)) {
          for (const c of Object.values(file.s || {})) { agg.statements.t++; if (c > 0) agg.statements.h++; }
          for (const arr of Object.values(file.b || {})) for (const c of arr) { agg.branches.t++; if (c > 0) agg.branches.h++; }
          for (const c of Object.values(file.f || {})) { agg.functions.t++; if (c > 0) agg.functions.h++; }
          const lines = file.statementMap ? new Map() : null;
          for (const [id, c] of Object.entries(file.s || {})) {
            const loc = file.statementMap && file.statementMap[id];
            if (!loc) continue;
            const ln = loc.start.line;
            const prev = lines.get(ln) || 0;
            if (c > 0 || prev > 0) lines.set(ln, Math.max(prev, c));
            else lines.set(ln, 0);
          }
          if (lines) for (const c of lines.values()) { agg.lines.t++; if (c > 0) agg.lines.h++; }
        }
        const min = 90;
        let bad = false;
        for (const [k, v] of Object.entries(agg)) {
          const pct = v.t === 0 ? 100 : (100 * v.h / v.t);
          console.log(k + ': ' + pct.toFixed(2) + '% (' + v.h + '/' + v.t + ')');
          if (pct < min) { console.error('FAIL: ' + k + ' < ' + min); bad = true; }
        }
        process.exit(bad ? 1 : 0);
        "
      displayName: 'enforce coverage threshold (90%)'
