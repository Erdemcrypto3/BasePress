# PAI-0028: CI security gates — every PR runs these before merge.
# Mirror in azure-pipelines-security.yml; keep both in sync.
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: pre-compile contracts
        working-directory: contracts
        run: pnpm exec hardhat compile
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contracts/
          fail-on: high
          slither-args: --filter-paths "node_modules"
          sarif: results.sarif
          ignore-compile: true
      - name: upload sarif
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - working-directory: contracts
        run: pnpm exec hardhat coverage
      - working-directory: contracts
        name: enforce coverage threshold
        # solidity-coverage emits coverage-final.json (Istanbul per-file). Aggregate
        # to summary and fail if any pillar below 90%.
        run: |
          node -e "
          const data = require('./coverage/coverage-final.json');
          const agg = { statements: {h:0,t:0}, branches: {h:0,t:0}, functions: {h:0,t:0}, lines: {h:0,t:0} };
          for (const file of Object.values(data)) {
            for (const c of Object.values(file.s || {})) { agg.statements.t++; if (c > 0) agg.statements.h++; }
            for (const arr of Object.values(file.b || {})) for (const c of arr) { agg.branches.t++; if (c > 0) agg.branches.h++; }
            for (const c of Object.values(file.f || {})) { agg.functions.t++; if (c > 0) agg.functions.h++; }
            const lines = file.statementMap ? new Map() : null;
            for (const [id, c] of Object.entries(file.s || {})) {
              const loc = file.statementMap && file.statementMap[id];
              if (!loc) continue;
              const ln = loc.start.line;
              const prev = lines.get(ln) || 0;
              if (c > 0 || prev > 0) lines.set(ln, Math.max(prev, c));
              else lines.set(ln, 0);
            }
            if (lines) for (const c of lines.values()) { agg.lines.t++; if (c > 0) agg.lines.h++; }
          }
          const min = 90;
          let bad = false;
          for (const [k, v] of Object.entries(agg)) {
            const pct = v.t === 0 ? 100 : (100 * v.h / v.t);
            console.log(k + ': ' + pct.toFixed(2) + '% (' + v.h + '/' + v.t + ')');
            if (pct < min) { console.error('FAIL: ' + k + ' < ' + min); bad = true; }
          }
          process.exit(bad ? 1 : 0);
          "
